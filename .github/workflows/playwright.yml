name: Playwright Tests
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    services:
      stirling-pdf:
        image: docker.stirlingpdf.com/stirlingtools/stirling-pdf:2.14.3
        ports:
          - 8080:8080
        env:
          DOCKER_ENABLE_SECURITY: "true"
          SECURITY_ENABLELOGIN: "true"
          SECURITY_INITIALLOGIN_USERNAME: "admin"
          SECURITY_INITIALLOGIN_PASSWORD: "changeme123"
          SECURITY_CUSTOMGLOBALAPIKEY: "test-key-12345"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Wait for Stirling-PDF to be ready
        run: |
          for i in {1..30}; do
            status=$(curl -sf -o /dev/null -w "%{http_code}" http://localhost:8080/login || echo "000")
            echo "Attempt $i: HTTP $status"
            if [ "$status" = "200" ]; then
              echo "Stirling-PDF is up"
              break
            fi
            sleep 3
          done
      - name: Dump Stirling-PDF container logs
        run: |
          docker ps -a
          echo "---- Stirling-PDF logs ----"
          docker logs $(docker ps -aqf "ancestor=docker.stirlingpdf.com/stirlingtools/stirling-pdf:2.14.3") 2>&1 | tail -200
      - name: Run Playwright tests
        run: npx playwright test
        env:
          CI: true
          E2E_USERNAME: ${{ secrets.E2E_USERNAME }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      - name: Dump Stirling-PDF logs on failure
        if: failure()
        run: docker logs $(docker ps -aqf "ancestor=docker.stirlingpdf.com/stirlingtools/stirling-pdf:2.14.3") 2>&1 | tail -300
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
