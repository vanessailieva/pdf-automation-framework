name: Playwright Tests
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    services:
      stirling-pdf:
        image: docker.stirlingpdf.com/stirlingtools/stirling-pdf
        ports:
          - 8080:8080
        env:
          DOCKER_ENABLE_SECURITY: "true"
          SECURITY_ENABLELOGIN: "true"
          SECURITY_INITIALLOGIN_USERNAME: "admin"
          SECURITY_INITIALLOGIN_PASSWORD: "changeme123"
          SECURITY_CUSTOMGLOBALAPIKEY: "test-key-12345"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Wait for Stirling-PDF to fully warm up
        run: |
          echo "Sleeping 60s to let Stirling-PDF finish booting..."
          sleep 60
          curl -s http://localhost:8080/login -o /dev/null -w "Final check - HTTP %{http_code}\n"
      - name: Run Playwright tests
        run: npx playwright test
        env:
          CI: true
          E2E_USERNAME: ${{ secrets.E2E_USERNAME }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
